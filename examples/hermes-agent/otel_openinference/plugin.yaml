name: otel_openinference
version: "1.0.0"
description: "OpenInference OTLP observability for Hermes — exports session/turn/LLM/tool/subagent spans to any OTLP traces endpoint (Machora, OTel Collector, DataDog). Opt-in via `hermes plugins enable observability/otel_openinference`."
author: NousResearch
hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
