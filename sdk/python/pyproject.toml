[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machora-sdk"
version = "0.1.0"
description = "Machora observability Python SDK: ingest traces, observations and scores"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["llm", "observability", "agent", "tracing", "opentelemetry", "langchain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]
urls = { Repository = "https://github.com/LeonChen26/Machroa" }

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
otel = [
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp-proto-http>=1.26",
]

[tool.hatch.build.targets.wheel]
packages = ["machora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
