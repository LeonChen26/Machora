[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machora-sdk"
version = "0.1.0"
description = "Machora observability Python SDK: ingest traces, observations and scores"
readme = { text = "Machora Python SDK. See docs in machora/__init__.py.", content-type = "text/plain" }
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["machora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
